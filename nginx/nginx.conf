events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    # Rate limiting for auth endpoints (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:3001;
    }

    # Default server (homelab dashboard)
    server {
        listen 80 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # Aurora (eigene Cloud) — eingebettet unter /aurora-app/. Der Prefix wird
        # beim Proxy entfernt; X-Forwarded-Prefix teilt Aurora den Mount-Pfad mit,
        # damit das SPA API/Links korrekt bildet. Same-Origin -> Login-Cookie klappt.
        location /aurora-app/ {
            proxy_pass http://host.docker.internal:8106/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /aurora-app;
            # Aurora-eigenes X-Frame-Options (DENY) verbergen; die Einbettung
            # erlaubt der Server-Header (SAMEORIGIN), da same-origin.
            proxy_hide_header X-Frame-Options;
            # Session-Cookie auf den Prefix begrenzen.
            proxy_cookie_path / /aurora-app/;
            client_max_body_size 2048m;
            proxy_read_timeout 300;
        }

        # Auth API (rate limited)
        location /api/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Mail inbound webhook (large payloads for attachments)
        location /api/mail/inbound {
            client_max_body_size 30m;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30;
        }

        # Backend API
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300;
            proxy_connect_timeout 60;
        }

        # Minecraft-Live-Konsole (WebSocket-Proxy zum Backend)
        location /api/minecraft/console {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # WebSocket
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
    }
}
