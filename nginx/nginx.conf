events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    # Rate limiting for auth endpoints (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Default server (homelab dashboard)
    server {
        listen 80 default_server;
        server_name _;

        # Upstreams als Variablen + resolver -> nginx löst die Container-IPs zur
        # LAUFZEIT auf statt sie beim Start zu cachen. Sonst zeigt nginx nach einem
        # "docker compose up --build" (Container bekommt neue IP) auf die alte IP
        # und liefert 502, bis man nginx neu startet. Wie bei Aurora unten.
        set $frontend_upstream http://frontend:3000;
        set $backend_upstream  http://backend:3001;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend
        location / {
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # Aurora (eigene Cloud) — eingebettet unter /aurora-app/. Aurora hat KEINEN
        # offenen Host-Port mehr und ist nur noch container-intern erreichbar
        # (gemeinsames Docker-Netz). Der Prefix wird beim Proxy entfernt;
        # X-Forwarded-Prefix teilt Aurora den Mount-Pfad mit, damit das SPA API/Links
        # korrekt bildet. Same-Origin -> Login-Cookie klappt.
        location /aurora-app/ {
            # Variable + resolver -> Auflösung zur Laufzeit (unabhängig von der
            # Container-Startreihenfolge; nginx crasht nicht, wenn aurora kurz fehlt).
            set $aurora_upstream http://aurora:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /aurora-app;
            # Aurora-eigenes X-Frame-Options (DENY) verbergen; die Einbettung
            # erlaubt der Server-Header (SAMEORIGIN), da same-origin.
            proxy_hide_header X-Frame-Options;
            # Session-Cookie auf den Prefix begrenzen.
            proxy_cookie_path / /aurora-app/;
            client_max_body_size 2048m;
            proxy_read_timeout 300;
            # Prefix strippen und an den Container weiterreichen.
            rewrite ^/aurora-app/(.*)$ /$1 break;
            proxy_pass $aurora_upstream;
        }

        # CardDAV/CalDAV (Kontakte/Kalender-Sync für externe Clients wie iOS,
        # Thunderbird, DAVx5). Direkt an Aurora, ohne Prefix-Strip — der DAV-Handler
        # erwartet absolute Pfade (/dav/contacts/…). Variable + resolver wie oben.
        location /dav/ {
            set $aurora_dav http://aurora:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Frame-Options;
            client_max_body_size 50m;
            proxy_read_timeout 300;
            proxy_pass $aurora_dav;
        }

        # DAV-Discovery: Clients fragen /.well-known/{carddav,caldav} ab.
        location /.well-known/carddav {
            set $aurora_wk http://aurora:8080;
            proxy_set_header Host $host;
            proxy_pass $aurora_wk;
        }
        location /.well-known/caldav {
            set $aurora_wkc http://aurora:8080;
            proxy_set_header Host $host;
            proxy_pass $aurora_wkc;
        }

        # Auth API (rate limited)
        location /api/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Mail inbound webhook (large payloads for attachments)
        location /api/mail/inbound {
            client_max_body_size 30m;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30;
        }

        # Backend API
        location /api {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300;
            proxy_connect_timeout 60;
        }

        # Minecraft-Live-Konsole (WebSocket-Proxy zum Backend)
        location /api/minecraft/console {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # WebSocket
        location /ws {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
    }
}
