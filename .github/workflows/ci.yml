# Homelab Dashboard — Prüfungen bei jedem Push
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # enthält die Typprüfung
      - run: npm audit --omit=dev --audit-level=high

  bot-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot-runtime/package-lock.json
      - run: npm ci
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm audit --omit=dev --audit-level=high
